[scene]
id = "tunnel"
name = "隧道照明"
description = "公路/隧道照明，需恒流驱动、应急电源接口、长距通信"
priority = "P2"

[hard_constraints]

[[hard_constraints.items]]
field = "product_specs.efficacy.value"
op = "gte"
value = 150
comment = "隧道需高光效"

[[hard_constraints.items]]
field = "environment.temp_range.min"
op = "lte"
value = -20
comment = "隧道可能存在低温"

[[hard_constraints.items]]
field = "environment.ip_ratings"
op = "contains_any"
value = ["IP65", "IP66", "IP67"]
comment = "隧道潮湿、粉尘，需 IP65+"

[[hard_constraints.items]]
field = "sensor_module.type"
op = "ne"
value = "none"
comment = "隧道需感应联动"

[soft_scoring]

[soft_scoring.dimensions.efficacy_match]
weight = 0.25
comment = "隧道要求高光效"

[soft_scoring.dimensions.efficacy_match.scoring]
type = "range"
field = "product_specs.efficacy.value"
ideal_min = 170
ideal_max = 999
slope = 20

[soft_scoring.dimensions.ip_match]
weight = 0.20
comment = "IP 防护"

[soft_scoring.dimensions.ip_match.scoring]
type = "ip_minimum"
field = "environment.ip_ratings"
minimum_ip = "IP65"
score_per_level_above = 0.05

[soft_scoring.dimensions.communication_match]
weight = 0.20
comment = "隧道长距离通信"

[soft_scoring.dimensions.communication_match.scoring]
type = "enum_intersect"
field = "communication_module.downlink"
ideal = ["lora", "rs-485", "ethernet"]
mapping = { rs_485 = 1.0, ethernet = 1.0, lora = 0.8, zigbee = 0.4 }
mode = "max"

[soft_scoring.dimensions.protocol_match]
weight = 0.15
comment = "隧道需对接监控系统"

[soft_scoring.dimensions.protocol_match.scoring]
type = "enum_intersect"
field = "communication_module.protocols.industrial"
ideal = ["modbus", "opc_ua"]
mapping = { modbus = 1.0, opc_ua = 1.0, siemens_plc = 0.6, mitsubishi_plc = 0.6 }
mode = "max"

[soft_scoring.dimensions.sensor_match]
weight = 0.10
comment = "隧道传感器"

[soft_scoring.dimensions.sensor_match.scoring]
type = "enum_exact"
field = "sensor_module.type"
mapping = { "radar_5.8G" = 1.0, "radar_10G" = 1.0, microwave = 0.8, pir = 0.3 }

[soft_scoring.dimensions.temp_margin]
weight = 0.10
comment = "温度余量"

[soft_scoring.dimensions.temp_margin.scoring]
type = "range"
field = "environment.temp_range.min"
ideal_min = -999
ideal_max = -25
slope = 10
